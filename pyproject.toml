[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-mirror-display"
version = "26.7.9"
description = "A remotely managed ambient smart mirror display"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.9.3",
    "opencv-python==4.12.0.88",
    "requests==2.32.5",
    "feedparser==6.0.12",
    "icalendar==6.3.1",
    "pytz==2025.2",
    "certifi==2025.8.3",
    "python-dateutil==2.9.0.post0",
    "psutil==7.2.2",
    "yt-dlp==2026.3.3",
]

[tool.setuptools]
py-modules = ["Main", "widget_manager", "web_server"]
